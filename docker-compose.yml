x-app-secrets: &app-secrets
  STARLINK_SESSION_SECRET: ${STARLINK_SESSION_SECRET:-dev-only-starlink-session-secret-change-me-2026}
  STARLINK_CALLBACK_SECRET: ${STARLINK_CALLBACK_SECRET:-dev-only-starlink-callback-secret-change-me-2026}
  STARLINK_WEBHOOK_SIGNING_SECRET: ${STARLINK_WEBHOOK_SIGNING_SECRET:-dev-only-starlink-webhook-secret-change-me-2026}

services:
  mysql:
    image: mysql:8.0
    container_name: starlink-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: starlink
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - starlink-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: starlink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - starlink-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 仅 api 负责 build；scheduler/pusher 复用同一镜像，避免并行 build 抢写 starlink:latest
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: starlink:latest
    container_name: starlink-api
    restart: unless-stopped
    environment:
      <<: *app-secrets
      APP: api
      CONFIG: /app/configs/config.yaml
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  scheduler:
    image: starlink:latest
    container_name: starlink-scheduler
    restart: unless-stopped
    environment:
      <<: *app-secrets
      APP: scheduler
      CONFIG: /app/configs/config.yaml
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  pusher:
    image: starlink:latest
    container_name: starlink-pusher
    restart: unless-stopped
    environment:
      <<: *app-secrets
      APP: pusher
      CONFIG: /app/configs/config.yaml
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  # 独立前端镜像：nginx 静态资源 + /api 反代到 api:8080
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: starlink-web:latest
    container_name: starlink-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/web-healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  starlink-mysql-data:
  starlink-redis-data:
